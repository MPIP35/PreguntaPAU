<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pregunta para mi querida PAU 💖</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; width:100vw; height:100vh; overflow:hidden;
  display:flex; justify-content:center; align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#f3d1d9,#e8c0cb,#f5dfe4);
  color:#8e6872;
}
.flor{position:fixed;font-size:28px;opacity:.55;animation:flotar 7s linear infinite;pointer-events:none}
@keyframes flotar{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-120px) rotate(360deg)}}
.card{
  width:min(92%,520px); padding:34px 28px 38px; text-align:center;
  background:rgba(255,250,251,.82); border:2px solid rgba(255,255,255,.8);
  border-radius:30px; box-shadow:0 18px 45px rgba(126,82,96,.2);
  backdrop-filter:blur(8px); z-index:5;
}
.imagenes{display:flex;justify-content:center;gap:14px;margin-bottom:14px}
.imagenes img{width:105px;height:105px;object-fit:cover;border-radius:22px;border:4px solid #e1b1bc;box-shadow:0 6px 15px rgba(120,70,85,.15)}
h1{font-size:30px;color:#936572;margin:12px 0}
p{font-size:17px;margin:0 0 28px}
.botones{display:flex;justify-content:center;gap:22px}
button{border:0;border-radius:17px;padding:14px 30px;font-size:19px;font-weight:bold;color:white;cursor:pointer;box-shadow:0 5px 12px rgba(120,70,85,.15)}
#si{background:#c99aa7}
#no{background:#b98998}
#si:hover{transform:scale(1.08)}
.final{display:none;font-size:23px;color:#936572;font-weight:bold;margin-top:20px}
</style>
</head>
<body>
<div id="flores"></div>
<main class="card">
  <div class="imagenes">
    <img src="Fotos PAU/Foto 1.png " alt="tortuga">
    <img src="Fotos PAU/Foto 2.png" alt="Capibara">
  </div>
  <h1 id="pregunta">¿Me perdonas por no poder ir mañana? 💖</h1>
  <p id="texto">Elige una opción... 🌸🐻✨</p>
  <div class="botones">
    <button id="si">Sí 🥰</button>
    <button id="no">No 🙈</button>
  </div>
  <div class="final" id="final">¡Sabía que dirías que sí! 💗🌸🐻✨</div>
</main>
<script>
const no=document.getElementById("no"), si=document.getElementById("si");
const texto=document.getElementById("texto"), final=document.getElementById("final");
const frases=["¿Segura? 🥺","Piénsalo otra vez 🌸","No seas tímida 🐻💕","¿Tal vez querías decir que sí? 😳","¡Ese botón no se deja atrapar! 🙈","Última oportunidad 💖"];
let i=0;
function mover(){
  const x=Math.max(8,Math.random()*(innerWidth-no.offsetWidth-16));
  const y=Math.max(8,Math.random()*(innerHeight-no.offsetHeight-16));
  no.style.position="fixed"; no.style.left=x+"px"; no.style.top=y+"px";
  texto.textContent=frases[i++%frases.length];
}
no.addEventListener("mouseenter",mover);
no.addEventListener("touchstart",e=>{e.preventDefault();mover()});
si.addEventListener("click",()=>{
  document.querySelector(".botones").style.display="none";
  document.getElementById("pregunta").textContent="💖 ¡Yay! 💖";
  texto.textContent="";
  final.style.display="block";
});
const emojis=["💖","🌸","💕","✨","🩷","🐻"];
for(let i=0;i<12;i++){
  const d=document.createElement("div"); d.className="flor";
  d.textContent=emojis[i%emojis.length];
  d.style.left=Math.random()*100+"vw";
  d.style.animationDelay=(-Math.random()*7)+"s";
  d.style.animationDuration=(5+Math.random()*5)+"s";
  document.getElementById("flores").appendChild(d);
}
</script>
</body>
</html>
